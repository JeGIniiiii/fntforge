[package]
name = "fntforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FntForge desktop GUI and CLI"
default-run = "fntforge"

[[bin]]
name = "fntforge"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["eframe", "egui", "rfd"]

[dependencies]
fntforge-core = { path = "../fntforge-core" }
fntforge-import = { path = "../fntforge-import" }
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde_json.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
